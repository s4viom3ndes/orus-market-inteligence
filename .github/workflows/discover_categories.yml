name: discover-categories

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      max_depth:
        description: "Profundidade maxima (default 2)"
        required: false
        default: "2"

concurrency:
  group: discover-categories
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ML_APP_ID: ${{ secrets.ML_APP_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
      ML_WEBHOOK_SECRET: ${{ secrets.ML_WEBHOOK_SECRET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m jobs.discover_categories --max-depth ${{ inputs.max_depth || 2 }}

name: collect-market

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      enrich:
        description: "Rodar enrichment (visits/reviews/questions)?"
        required: false
        default: "true"

concurrency:
  group: collect-market
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: etl
    env:
      ML_APP_ID: ${{ secrets.ML_APP_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
      ML_WEBHOOK_SECRET: ${{ secrets.ML_WEBHOOK_SECRET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Collect market (with enrichment, capped 10 products/category)
        run: python -m jobs.collect_market --max-per-cat 10
